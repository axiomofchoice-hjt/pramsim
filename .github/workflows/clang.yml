name: clang checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  clang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            clang-format \
            llvm \
            python3

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Generate compile_commands.json
        run: |
          xmake project -y -k compile_commands build

      - name: Run clang-format (check only)
        run: |
          clang-format --version
          files=$(git ls-files '*.cpp' '*.h')
          clang-format --dry-run --Werror $files

      - name: Run clang-tidy
        run: |
          run-clang-tidy -p build

  asan:
    runs-on: ubuntu-latest
    # The examples are C++23 (<print>, std::ranges::to, std::views::enumerate) and need a toolchain
    # the runner's default GCC does not provide, so pin one in a container instead of guessing.
    container: gcc:15

    steps:
      - name: Prepare container
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git)
          git config --global --add safe.directory '*' || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: g++ --version

      - name: Build examples with AddressSanitizer
        run: |
          mkdir -p build-asan
          for src in examples/*.cpp; do
            name=$(basename "$src" .cpp)
            g++ -std=c++23 -O1 -g -Iinclude \
              -fsanitize=address -fsanitize-address-use-after-scope \
              -Wall -Wextra -Wpedantic -Werror \
              "$src" -o "build-asan/$name"
          done

      - name: Run examples under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1
        run: |
          for bin in build-asan/*; do
            echo "== $bin"
            "$bin"
          done
